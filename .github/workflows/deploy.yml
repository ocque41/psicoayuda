name: Deploy to Cloudflare

# Build en Linux (OpenNext no compila un Worker funcional en Windows nativo) y
# despliega a Cloudflare. Disparo MANUAL para no publicar WIP a medio hacer por
# accidente (varias ramas/sesiones empujan a main).
#
# Requisito (una vez, en GitHub → Settings → Secrets and variables → Actions):
#   - CLOUDFLARE_API_TOKEN  (permisos Workers Scripts:Edit, D1:Edit, Workers Routes:Edit)
# El account id va abajo (no es secreto). El secreto de RUNTIME del Worker
# (BETTER_AUTH_SECRET) se pone una vez con `wrangler secret put`, NO aquí.

on:
  workflow_dispatch:

concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Next build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Apply D1 migrations (production)
        # El CLOUDFLARE_API_TOKEN de CI ya tiene permiso D1:Edit, así que este paso
        # aplica las migraciones pendientes antes de desplegar. Es BLOQUEANTE a
        # propósito: si una migración falla, se detiene el deploy (evita schema
        # drift, es decir, publicar código que espera tablas/columnas inexistentes).
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: acf3c9d9659c2195909c29fd6af3316e

      - name: Prepare local D1 schema for prerender
        # `next build` prerenderiza las rutas ISR contra Miniflare, no contra la
        # D1 remota. Sin este paso el build registraba `no such table` y generaba
        # silenciosamente una portada vacía aunque el job terminara en verde.
        run: pnpm exec wrangler d1 migrations apply nido-venezuela-db --local

      - name: Build (OpenNext → Cloudflare)
        run: pnpm exec opennextjs-cloudflare build
        env:
          NIDO_DB_TARGET: cloudflare
          NEXT_PUBLIC_SITE_URL: https://saludmental-venezuela.com
          BETTER_AUTH_URL: https://saludmental-venezuela.com
          # Marcador SOLO para el build; el secreto real vive como secreto de
          # Cloudflare (wrangler secret put BETTER_AUTH_SECRET).
          BETTER_AUTH_SECRET: deploy-build-placeholder-not-the-real-secret

      - name: Deploy
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          NIDO_DB_TARGET: cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: acf3c9d9659c2195909c29fd6af3316e

      - name: Smoke test + rollback automático
        # Verifica el Worker, contenido real, una ruta dinámica y el redirect de
        # www. Los límites de conexión evitan que CI quede colgado si el edge no
        # es alcanzable. Cualquier fallo revierte el deploy anterior.
        run: |
          set -uo pipefail
          fetch() {
            curl --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              --retry 2 --retry-all-errors "$@"
          }
          check_status() {
            local path="$1" expected="$2" code=""
            for i in 1 2 3 4 5 6; do
              code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
                --connect-timeout 10 --max-time 25 \
                "https://saludmental-venezuela.com${path}" || true)
              if [ "$code" = "$expected" ]; then
                echo "OK  GET ${path} -> ${expected}"
                return 0
              fi
              echo "... GET ${path} -> ${code} (reintento ${i}/6)"
              sleep 5
            done
            echo "FALLO GET ${path} -> ${code}"
            return 1
          }
          ok=1
          check_status "/healthz" "200" || ok=0
          check_status "/" "200" || ok=0
          check_status "/pro" "200" || ok=0
          fetch "https://saludmental-venezuela.com/" | grep -Fq "Ayuda psicológica gratis en Venezuela" || {
            echo "FALLO portada: respondió 200 pero no contiene el contenido esperado"
            ok=0
          }
          redirect=$(curl --silent --output /dev/null --write-out "%{redirect_url}" \
            --connect-timeout 10 --max-time 25 \
            "https://www.saludmental-venezuela.com/" || true)
          if [ "$redirect" != "https://saludmental-venezuela.com/" ]; then
            echo "FALLO www: redirect inesperado '${redirect}'"
            ok=0
          else
            echo "OK  www -> dominio raíz"
          fi
          if [ "$ok" != "1" ]; then
            echo "::error::Smoke test falló tras el deploy. Revirtiendo al deploy anterior."
            pnpm exec wrangler rollback --message "Auto-rollback: falló la comprobación integral post-deploy."
            exit 1
          fi
          echo "Smoke test OK: producción sana."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: acf3c9d9659c2195909c29fd6af3316e
